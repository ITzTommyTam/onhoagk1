<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ôn Tập Hóa Học 12 - Sakura Full Edition (Tráo Câu Hỏi)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --sakura-bg: #fff0f3;
      --sakura-card: rgba(255, 255, 255, 0.94);
      --sakura-border: #ffccd5;
      --sakura-primary: #ff758f;
      --sakura-dark: #c9184a;
      --sakura-text: #4a1e28;
      --correct: #2b9348;
      --correct-bg: #e8f5e9;
      --wrong: #d90429;
      --wrong-bg: #ffebee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #fff0f3 0%, #ffccd5 50%, #ffb3c1 100%);
      color: var(--sakura-text);
      min-height: 100vh;
      position: relative;
    }

    #sakura-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 25px 15px 80px;
      position: relative;
      z-index: 10;
    }

    header {
      background: var(--sakura-card);
      backdrop-filter: blur(12px);
      padding: 22px;
      border-radius: 20px;
      text-align: center;
      border: 2px solid var(--sakura-border);
      box-shadow: 0 10px 25px rgba(255, 117, 143, 0.18);
      margin-bottom: 20px;
    }

    header h1 {
      font-family: 'Quicksand', sans-serif;
      color: var(--sakura-dark);
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    /* Score banner */
    .scoreboard {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 14px;
      font-size: 0.98rem;
      font-weight: 700;
      flex-wrap: wrap;
    }
    .score-item {
      background: #ffe5ec;
      padding: 6px 16px;
      border-radius: 30px;
      color: var(--sakura-dark);
      border: 1px solid var(--sakura-border);
    }

    /* Nút tráo câu hỏi nổi bật */
    .btn-shuffle {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(135deg, #ff4d6d, #c9184a);
      color: white;
      border: none;
      padding: 9px 22px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(201, 24, 74, 0.35);
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-shuffle:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 20px rgba(201, 24, 74, 0.5);
    }
    .btn-shuffle:active {
      transform: translateY(0);
    }

    /* Navigation tabs */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      font-family: 'Quicksand', sans-serif;
      background: var(--sakura-card);
      border: 2px solid var(--sakura-border);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--sakura-text);
      transition: all 0.25s;
    }
    .tab-btn.active {
      background: var(--sakura-dark);
      color: white;
      border-color: var(--sakura-dark);
      box-shadow: 0 4px 15px rgba(201, 24, 74, 0.35);
    }

    /* Question cards */
    .q-card {
      background: var(--sakura-card);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      border: 1.5px solid var(--sakura-border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.03);
      transition: all 0.25s ease;
    }
    .q-card:hover {
      box-shadow: 0 10px 25px rgba(255, 117, 143, 0.2);
    }

    .q-header {
      font-weight: 700;
      font-size: 1.08rem;
      margin-bottom: 14px;
      line-height: 1.5;
    }
    .q-num {
      background: var(--sakura-dark);
      color: white;
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 8px;
      margin-right: 8px;
      display: inline-block;
    }

    /* Options */
    .options-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
    }
    @media(min-width: 600px) {
      .options-list.two-col { grid-template-columns: 1fr 1fr; }
    }

    .opt-btn {
      display: flex;
      align-items: center;
      padding: 11px 15px;
      background: white;
      border: 1.5px solid #ffe5ec;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.96rem;
      transition: all 0.2s;
      text-align: left;
    }
    .opt-btn:hover:not(.disabled) {
      background: #fff0f3;
      border-color: var(--sakura-primary);
      transform: translateY(-1px);
    }
    .opt-btn.correct {
      background: var(--correct-bg) !important;
      border-color: var(--correct) !important;
      color: var(--correct) !important;
      font-weight: 700;
    }
    .opt-btn.wrong {
      background: var(--wrong-bg) !important;
      border-color: var(--wrong) !important;
      color: var(--wrong) !important;
      font-weight: 700;
    }
    .opt-btn.disabled {
      cursor: default;
    }

    /* True/False Sub-questions */
    .tf-table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid #ffd6de;
    }
    .tf-table th {
      background: #ffe5ec;
      padding: 9px 12px;
      font-size: 0.9rem;
      color: var(--sakura-dark);
    }
    .tf-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #ffe5ec;
      font-size: 0.94rem;
    }
    .tf-btns {
      display: flex;
      gap: 6px;
      justify-content: center;
    }
    .tf-choice {
      padding: 5px 14px;
      border: 1px solid #ffb3c1;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      transition: all 0.2s;
    }
    .tf-choice:hover:not(.disabled) {
      background: var(--sakura-bg);
    }
    .tf-choice.correct {
      background: var(--correct) !important;
      color: white !important;
      border-color: var(--correct) !important;
    }
    .tf-choice.wrong {
      background: var(--wrong) !important;
      color: white !important;
      border-color: var(--wrong) !important;
    }

    /* Feedback Box */
    .feedback-box {
      display: none;
      margin-top: 12px;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 0.93rem;
      line-height: 1.45;
      animation: fadeIn 0.3s ease;
    }
    .feedback-box.show { display: block; }
    .feedback-box.correct {
      background: var(--correct-bg);
      border-left: 4px solid var(--correct);
      color: #1b4332;
    }
    .feedback-box.wrong {
      background: var(--wrong-bg);
      border-left: 4px solid var(--wrong);
      color: #7209b7;
    }

    /* Thông báo Toast khi tráo câu */
    .toast-msg {
      position: fixed;
      top: 25px;
      right: 25px;
      background: #c9184a;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      font-weight: 700;
      font-size: 0.95rem;
      z-index: 999;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <canvas id="sakura-canvas"></canvas>
  <div class="toast-msg" id="toast">🌸 Đã tráo câu hỏi! Thứ tự số câu vẫn từ 1 đến hết.</div>

  <div class="container">
    <header>
      <h1>🌸 ÔN TẬP HÓA HỌC 12 - GIỮA KÌ I 🌸</h1>
      <p>Chọn phương án để <b>chấm điểm & hiển thị giải thích tức thì</b></p>
      
      <div class="scoreboard">
        <div class="score-item">Đúng: <span id="correct-count">0</span></div>
        <div class="score-item">Sai: <span id="wrong-count">0</span></div>
        <div class="score-item">Đã làm: <span id="done-count">0</span></div>
        <button class="btn-shuffle" onclick="shuffleAllQuestions()">
          🔀 Tráo câu hỏi
        </button>
      </div>
    </header>

    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showSection('mcq')">Phần 1: Trắc Nghiệm (1 - 94 câu)</button>
      <button class="tab-btn" onclick="showSection('tf')">Phần 2: Đúng / Sai (1 - 34 câu)</button>
    </div>

    <!-- Container cho phần Trắc nghiệm -->
    <div id="mcq-container"></div>

    <!-- Container cho phần Đúng / Sai -->
    <div id="tf-container" style="display: none;"></div>
  </div>

  <script>
    // TẬP DỮ LIỆU GỐC: TRẮC NGHIỆM
    const originalMCQ = [
      { id: 1, q: "Ethyl acetate có công thức là", a: ["C2H5COOCH3", "CH3COOC2H5", "CH3COOH", "CH3COOCH3"], c: 1, exp: "Gốc acetate là CH3COO-, ethyl là C2H5- => CH3COOC2H5." },
      { id: 2, q: "Vinyl acetate có công thức là", a: ["CH3COOCH=CH2", "CH3COOCH(CH3)2", "CH2=CHCOOCH3", "HCOOCH2CH3"], c: 0, exp: "Gốc vinyl là -CH=CH2 => CH3COOCH=CH2." },
      { id: 3, q: "Methyl benzoate có công thức là", a: ["CH3COOC6H5", "CH3COOCH2C6H5", "C6H5COOCH3", "C6H5COOCH=CH2"], c: 2, exp: "Acid benzoic là C6H5COOH, gốc methyl là -CH3 => C6H5COOCH3." },
      { id: 4, q: "Sắp xếp theo chiều nhiệt độ sôi tăng dần của: (1) C3H7COOH; (2) CH3COOC2H5; (3) C3H7CH2OH.", a: ["(3), (2), (1)", "(1), (2), (3)", "(2), (3), (1)", "(1), (3), (2)"], c: 2, exp: "Ester (không có lk hydrogen) < Alcohol < Carboxylic acid (liên kết H bền nhất)." },
      { id: 5, q: "Phenyl formate có công thức là", a: ["CH3COOCH2C6H5", "CH3COOC6H4CH3", "CH3COOC6H5", "HCOOC6H5"], c: 3, exp: "Formate là HCOO-, phenyl là -C6H5 => HCOOC6H5." },
      { id: 6, q: "Số ester có CTPT C4H8O2 mà khi thủy phân thu được sản phẩm có khả năng tráng bạc là:", a: ["1", "2", "3", "4"], c: 1, exp: "Có dạng HCOOR: HCOOCH2CH2CH3 và HCOOCH(CH3)2 (2 đồng phân)." },
      { id: 8, q: "Ester nào sau đây có mùi dứa chín?", a: ["Ethyl isovalerate", "Ethyl butyrate", "Benzyl acetate", "Isoamyl acetate"], c: 1, exp: "Ethyl butyrate và ethyl propionate có mùi dứa chín." },
      { id: 9, q: "Trong số các ester sau, ester có mùi chuối chín là:", a: ["Methyl acetate", "Isoamyl acetate", "Ethyl formate", "Methyl propionate"], c: 1, exp: "Isoamyl acetate có mùi chuối chín đặc trưng." },
      { id: 10, q: "Ester nào sau đây có mùi thơm của hoa nhài?", a: ["Isoamyl acetate", "Ethyl acetate", "Benzyl acetate", "Ethyl propionate"], c: 2, exp: "Benzyl acetate (CH3COOCH2C6H5) có mùi hoa nhài." },
      { id: 11, q: "Phản ứng đặc trưng của ester là:", a: ["Phản ứng trùng hợp", "Phản ứng xà phòng hóa", "Phản ứng cộng", "Phản ứng ester hóa"], c: 1, exp: "Phản ứng đặc trưng của ester là phản ứng thủy phân trong kiềm (xà phòng hóa)." },
      { id: 12, q: "Ở điều kiện thích hợp, 2 chất nào phản ứng tạo thành methyl acetate?", a: ["CH3COOH và CH3OH", "HCOOH và CH3OH", "CH3COOH và C2H5OH", "HCOOH và C2H5OH"], c: 0, exp: "CH3COOH + CH3OH <=> CH3COOCH3 + H2O." },
      { id: 13, q: "Một phân tử triolein có bao nhiêu nguyên tử oxygen?", a: ["5", "4", "6", "3"], c: 2, exp: "Chất béo là triester 3 chức (-COO-)3 nên có 6 nguyên tử oxygen." },
      { id: 14, q: "Chất béo là triester của acid béo với:", a: ["Ethylene glycol", "Glycerol", "Ethyl alcohol", "Methyl alcohol"], c: 1, exp: "Định nghĩa: Chất béo là triester của glycerol với các acid béo." },
      { id: 15, q: "Công thức hóa học của chất béo triolein là:", a: ["(C15H31COO)3C3H5", "(C17H33COO)3C3H5", "(C17H31COO)3C3H5", "(C17H35COO)3C3H5"], c: 1, exp: "Acid oleic là C17H33COOH => Triolein là (C17H33COO)3C3H5." },
      { id: 16, q: "Tên gọi của chất béo (CH3[CH2]16COO)3C3H5 là:", a: ["Trilinolein", "Tripalmitin", "Tristearin", "Triolein"], c: 2, exp: "CH3[CH2]16COO- chính là C17H35COO- (stearate) => Tristearin." },
      { id: 17, q: "Acid béo no mạch hở chứa tổng cộng 16 carbon (carbonyl C + 15 carbon béo) là:", a: ["Palmitic acid", "Oleic acid", "Linoleic acid", "Stearic acid"], c: 0, exp: "C15H31COOH là Palmitic acid (16 carbon, no)." },
      { id: 18, q: "Acid béo có 1 liên kết đôi cis ở vị trí C9-C10, mạch 18C là:", a: ["Palmitic acid", "Oleic acid", "Linoleic acid", "Stearic acid"], c: 1, exp: "Oleic acid: C17H33COOH có 1 liên kết C=C dạng cis." },
      { id: 19, q: "Để chuyển hóa chất béo lỏng thành chất béo rắn (margarine), người ta dùng phản ứng:", a: ["H2, đun nóng, xúc tác Ni", "Khí oxygen", "Nước bromine", "Dung dịch NaOH đun nóng"], c: 0, exp: "Hydrogen hóa chất béo lỏng không no thành chất béo no rắn (xúc tác Ni, to)." },
      { id: 20, q: "Chất béo nào sau đây ở trạng thái rắn ở điều kiện thường?", a: ["Tristearin", "Triolein", "Trilinolein", "Trilinolenin"], c: 0, exp: "Tristearin và Tripalmitin là chất béo no nên ở trạng thái rắn." },
      { id: 21, q: "Triolein không tác dụng với chất nào sau đây?", a: ["Khí H2 (Ni, to)", "Kim loại Na", "Dung dịch KOH (to)", "Dung dịch Bromine"], c: 1, exp: "Chất béo không có nhóm -OH linh động nên không tác dụng với Na." },
      { id: 22, q: "Một chất béo có CTPT C57H98O6 tạo bởi acid béo X và glycerol. Công thức của X là:", a: ["C15H31COOH", "C17H31COOH", "C17H33COOH", "C17H29COOH"], c: 1, exp: "(RCOO)3C3H5 = C57H98O6 => Gốc R là C17H31- (Linoleic acid)." },
      { id: 23, q: "Cho glycerol phản ứng với hỗn hợp gồm C17H35COOH và C15H31COOH, số loại triester tối đa là:", a: ["6", "3", "5", "4"], c: 0, exp: "Số triester = n^2*(n+1)/2 = 2^2 * 3 / 2 = 6." },
      { id: 24, q: "Chất nào sau đây là thành phần chủ yếu của xà phòng?", a: ["CH3COONa", "CH3(CH2)3COONa", "CH2=CHCOONa", "C17H35COONa"], c: 3, exp: "Xà phòng là muối sodium/potassium của acid béo (như C17H35COONa, C15H31COONa)." },
      { id: 25, q: "Chất nào là thành phần chính của chất giặt rửa tổng hợp?", a: ["C15H31COONa", "(C17H35COO)2Ca", "CH3[CH2]11-C6H4-SO3Na", "C17H35COOK"], c: 2, exp: "Sodium alkylbenzenesulfonate là chất giặt rửa tổng hợp." },
      { id: 26, q: "Trong thực tế, người ta dùng phản ứng nào sau đây để điều chế xà phòng?", a: ["Đun nóng acid béo với kiềm", "Đun nóng chất béo với dung dịch kiềm", "Đun nóng glycerol với acid béo", "Đun acid béo hoặc chất béo với kiềm"], c: 1, exp: "Phản ứng xà phòng hóa chất béo bằng dung dịch NaOH/KOH đun nóng." },
      { id: 27, q: "Thủy phân chất béo X thu được hỗn hợp 3 acid: oleic, palmitic, stearic. Số CTCT của X là:", a: ["5", "2", "3", "4"], c: 2, exp: "Triester chứa 3 gốc acid khác nhau có 3! / 2 = 3 đồng phân cấu tạo." },
      { id: 28, q: "Glucose quan trọng đối với cơ thể sống vì nó:", a: ["Cung cấp nước và CO2", "Cung cấp năng lượng cho quá trình sinh hóa", "Xúc tác sinh hóa", "Làm giảm oxi hóa tự do"], c: 1, exp: "Glucose là nguồn nhiên liệu cung cấp năng lượng chủ yếu cho tế bào sống." },
      { id: 29, q: "Glucose và fructose thuộc loại carbohydrate nào sau đây?", a: ["Monosaccharide", "Disaccharide", "Polysaccharide", "Oligosaccharide"], c: 0, exp: "Glucose và Fructose là đường đơn (monosaccharide)." },
      { id: 30, q: "Công thức phân tử chung của glucose và fructose là:", a: ["C6H10O5", "C6H12O6", "C5H10O5", "C12H22O11"], c: 1, exp: "Glucose và fructose là đồng phân cấu tạo của nhau, có CTPT là C6H12O6." },
      { id: 31, q: "Nhóm chức nào sau đây không có trong cấu tạo mạch hở của glucose?", a: ["Aldehyde", "Hydroxy", "Ketone", "Hemiacetal"], c: 2, exp: "Mạch hở của glucose có 5 nhóm -OH và 1 nhóm -CHO, không có nhóm ketone (-CO-)." },
      { id: 32, q: "Chất thuộc loại disaccharide là:", a: ["Saccharose", "Cellulose", "Fructose", "Glucose"], c: 0, exp: "Disaccharide gồm Saccharose và Maltose." },
      { id: 33, q: "Chất thuộc loại polysaccharide là:", a: ["Cellulose", "Glucose", "Saccharose", "Fructose"], c: 0, exp: "Polysaccharide gồm Tinh bột và Cellulose." },
      { id: 34, q: "Carbohydrate là hợp chất hữu cơ:", a: ["Chứa amino và carboxyl", "Chứa hydroxy và carboxyl", "Tạp chức, thường có CTTQ Cn(H2O)m", "Đa chức chứa nhiều nhóm -OH"], c: 2, exp: "Định nghĩa Carbohydrate: hợp chất hữu cơ tạp chức, CTTQ Cn(H2O)m." },
      { id: 35, q: "Bệnh nhân cần tiếp đường (tiêm truyền tĩnh mạch) thường dùng dung dịch đường 5% nào?", a: ["Glucose", "Fructose", "Maltose", "Saccharose"], c: 0, exp: "Dung dịch glucose 5% được dùng làm dịch truyền trực tiếp vào tĩnh mạch." },
      { id: 36, q: "Phản ứng chứng minh glucose có nhóm -CHO và nhiều nhóm -OH liền kề lần lượt là:", a: ["Tráng gương và lên men rượu", "Thuốc thử Tollens và Cu(OH)2 nhiệt độ phòng", "Tạo phức Cu(OH)2 và lên men", "Lên men và thủy phân"], c: 1, exp: "Tollens chứng minh -CHO; Cu(OH)2 ở t° phòng tạo dd xanh lam chứng minh nhiều -OH kề nhau." },

      {

          { label: "b", text: "Trimethylamine là chất lỏng ở nhiệt độ thường.", ans: "S", exp: "(CH3)3N là chất khí." },
          { label: "c", text: "Aniline không phản ứng được với dung dịch acid HCl.", ans: "S", exp: "Aniline có tính base nên tác dụng tốt với acid mạnh HCl." },
          { label: "d", text: "Các alkylamine có tính base yếu hơn hoặc tương tự ammonia.", ans: "S", exp: "Alkylamine có nhóm alkyl đẩy electron làm tính base mạnh hơn ammonia." }
        ]
      }
    ];

    // MẢNG HIỆN HÀNH DÙNG ĐỂ HIỂN THỊ
    let currentMCQ = [...originalMCQ];
    let currentTF = [...originalTF];

    // THỐNG KÊ ĐIỂM
    let stats = { correct: 0, wrong: 0, done: 0 };
    function updateScoreUI() {
      document.getElementById('correct-count').innerText = stats.correct;
      document.getElementById('wrong-count').innerText = stats.wrong;
      document.getElementById('done-count').innerText = stats.done;
    }

    // THUẬT TOÁN XÁO TRỘN FISHER-YATES (CHỈ TRÁO CÂU HỎI, SỐ CÂU GIỮ NGUYÊN)
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // HÀM BẤM NÚT "TRÁO CÂU HỎI"
    function shuffleAllQuestions() {
      currentMCQ = shuffleArray(originalMCQ);
      currentTF = shuffleArray(originalTF);

      // Reset điểm số
      stats = { correct: 0, wrong: 0, done: 0 };
      updateScoreUI();

      // Render lại giao diện
      renderMCQ();
      renderTF();

      // Hiển thị thông báo nhanh
      const toast = document.getElementById('toast');
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);

      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    // RENDER PHẦN 1: TRẮC NGHIỆM (Số thứ tự hiển thị luôn từ 1 -> N)
    function renderMCQ() {
      const container = document.getElementById('mcq-container');
      container.innerHTML = currentMCQ.map((q, idx) => `
        <div class="q-card" id="mcq-card-${idx}">
          <div class="q-header">
            <span class="q-num">Câu ${idx + 1}</span> ${q.q}
          </div>
          <div class="options-list ${q.a.every(opt => opt.length < 24) ? 'two-col' : ''}">
            ${q.a.map((opt, oIdx) => `
              <button class="opt-btn" onclick="checkMCQ(${idx}, ${oIdx})">
                <b style="margin-right:8px">${['A','B','C','D'][oIdx]}.</b> ${opt}
              </button>
            `).join('')}
          </div>
          <div class="feedback-box" id="mcq-fb-${idx}"></div>
        </div>
      `).join('');
    }

    // CHẤM TỨC THÌ PHẦN 1
    function checkMCQ(cardIdx, chosenIdx) {
      const card = document.getElementById(`mcq-card-${cardIdx}`);
      const btns = card.querySelectorAll('.opt-btn');
      if (btns[0].classList.contains('disabled')) return; // Đã làm câu này

      const item = currentMCQ[cardIdx];
      const fbBox = document.getElementById(`mcq-fb-${cardIdx}`);
      btns.forEach(b => b.classList.add('disabled'));

      stats.done++;
      if (chosenIdx === item.c) {
        btns[chosenIdx].classList.add('correct');
        fbBox.className = 'feedback-box show correct';
        fbBox.innerHTML = `🌸 <b>Chính xác!</b><br>${item.exp}`;
        stats.correct++;
      } else {
        btns[chosenIdx].classList.add('wrong');
        btns[item.c].classList.add('correct');
        fbBox.className = 'feedback-box show wrong';
        fbBox.innerHTML = `❌ <b>Chưa đúng!</b> Đáp án đúng là <b>${['A','B','C','D'][item.c]}</b>.<br>${item.exp}`;
        stats.wrong++;
      }
      updateScoreUI();
    }

    // RENDER PHẦN 2: ĐÚNG / SAI (Số thứ tự hiển thị luôn từ 1 -> N)
    function renderTF() {
      const container = document.getElementById('tf-container');
      container.innerHTML = currentTF.map((q, idx) => `
        <div class="q-card" id="tf-card-${idx}">
          <div class="q-header">
            <span class="q-num">Câu ${idx + 1}</span> ${q.title}
          </div>
          <table class="tf-table">
            <thead>
              <tr>
                <th>Ý</th>
                <th>Phát biểu</th>
                <th style="width: 130px; text-align: center;">Chọn</th>
              </tr>
            </thead>
            <tbody>
              ${q.items.map((sub, sIdx) => `
                <tr id="tf-row-${idx}-${sIdx}">
                  <td style="font-weight:700; color:var(--sakura-dark); text-align:center;">${sub.label})</td>
                  <td>${sub.text}</td>
                  <td>
                    <div class="tf-btns">
                      <button class="tf-choice" onclick="checkTF(${idx}, ${sIdx}, 'Đ')">Đúng</button>
                      <button class="tf-choice" onclick="checkTF(${idx}, ${sIdx}, 'S')">Sai</button>
                    </div>
                  </td>
                </tr>
                <tr id="tf-subfb-${idx}-${sIdx}" style="display:none;">
                  <td colspan="3" style="padding: 6px 14px; background:#fff8f9; font-size:0.88rem; color:#800f2f;"></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `).join('');
    }

    // CHẤM TỨC THÌ PHẦN 2
    function checkTF(cardIdx, subIdx, choice) {
      const q = currentTF[cardIdx];
      const sub = q.items[subIdx];
      const row = document.getElementById(`tf-row-${cardIdx}-${subIdx}`);
      const btns = row.querySelectorAll('.tf-choice');
      if (btns[0].classList.contains('disabled')) return; // Đã làm ý này

      btns.forEach(b => b.classList.add('disabled'));
      const fbRow = document.getElementById(`tf-subfb-${cardIdx}-${subIdx}`);
      const fbTd = fbRow.querySelector('td');

      stats.done++;
      if (choice === sub.ans) {
        if (choice === 'Đ') btns[0].classList.add('correct');
        else btns[1].classList.add('correct');
        fbTd.innerHTML = `🌸 <b>Chính xác!</b> (${sub.ans === 'Đ' ? 'Đúng' : 'Sai'}): ${sub.exp}`;
        stats.correct++;
      } else {
        if (choice === 'Đ') {
          btns[0].classList.add('wrong');
          btns[1].classList.add('correct');
        } else {
          btns[1].classList.add('wrong');
          btns[0].classList.add('correct');
        }
        fbTd.innerHTML = `❌ <b>Sai!</b> Ý này là <b>${sub.ans === 'Đ' ? 'ĐÚNG' : 'SAI'}</b>: ${sub.exp}`;
        stats.wrong++;
      }
      fbRow.style.display = 'table-row';
      updateScoreUI();
    }

    // CHUYỂN TAB
    function showSection(type) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (type === 'mcq') {
        document.getElementById('mcq-container').style.display = 'block';
        document.getElementById('tf-container').style.display = 'none';
      } else {
        document.getElementById('mcq-container').style.display = 'none';
        document.getElementById('tf-container').style.display = 'block';
      }
      window.scrollTo({ top: 120, behavior: 'smooth' });
    }

    // HIỆU ỨNG CÁNH HOA ANH ĐÀO RƠI
    const canvas = document.getElementById('sakura-canvas');
    const ctx = canvas.getContext('2d');
    let w = (canvas.width = window.innerWidth);
    let h = (canvas.height = window.innerHeight);

    window.addEventListener('resize', () => {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    });

    const petals = Array.from({ length: 30 }, () => ({
      x: Math.random() * w,
      y: Math.random() * -h,
      size: Math.random() * 8 + 10,
      spX: Math.random() * 2 - 1,
      spY: Math.random() * 1.5 + 1.2,
      rot: Math.random() * 360,
      rotSp: Math.random() * 2 - 1,
      op: Math.random() * 0.4 + 0.6
    }));

    function drawPetals() {
      ctx.clearRect(0, 0, w, h);
      petals.forEach(p => {
        p.x += p.spX + Math.sin(p.y * 0.01) * 0.6;
        p.y += p.spY;
        p.rot += p.rotSp;
        if (p.y > h + 20) {
          p.y = -20;
          p.x = Math.random() * w;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.globalAlpha = p.op;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-p.size / 2, -p.size / 2, -p.size, p.size / 3, 0, p.size);
        ctx.bezierCurveTo(p.size, p.size / 3, p.size / 2, -p.size / 2, 0, 0);
        ctx.fillStyle = '#ffccd5';
        ctx.fill();
        ctx.strokeStyle = '#ff758f';
        ctx.lineWidth = 0.5;
        ctx.stroke();
        ctx.restore();
      });
      requestAnimationFrame(drawPetals);
    }

    // KHỞI CHẠY LẦN ĐẦU
    window.onload = () => {
      renderMCQ();
      renderTF();
      drawPetals();
    };
  </script>
